    <style>
        .btn-regresar {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 99999;
            background: #0284c7;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            border: 2px solid #ffffff;
            transition: all 0.2s ease;
        }

        .btn-regresar:hover {
            background: #0369a1;
            transform: scale(1.05);
        }
    </style>
